<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="50%" stop-color="#111827" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="title-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#60a5fa" />
      <stop offset="50%" stop-color="#a78bfa" />
      <stop offset="100%" stop-color="#f472b6" />
    </linearGradient>
    <linearGradient id="glow-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#8b5cf6" stop-opacity="0.1" />
    </linearGradient>
    <filter id="blur-filter" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="30" />
    </filter>
  </defs>

  <style>
    .bg { fill: url(#bg-grad); }
    .title {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      font-weight: 800;
      font-size: 44px;
      fill: url(#title-grad);
      letter-spacing: -0.5px;
    }
    .subtitle {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      font-weight: 500;
      font-size: 20px;
      fill: #cbd5e1;
    }
    .tagline {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      font-weight: 400;
      font-size: 14px;
      fill: #94a3b8;
    }
    .badge-text {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      font-weight: 600;
      font-size: 12px;
      fill: #e2e8f0;
    }

    /* Ambient animated background glows */
    @keyframes pulseOrb {
      0%, 100% { transform: scale(1) translate(0, 0); opacity: 0.35; }
      50% { transform: scale(1.15) translate(25px, -15px); opacity: 0.65; }
    }
    @keyframes floatPillLeft {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-8px); }
    }
    @keyframes floatPillRight {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(8px); }
    }
    @keyframes pulseRing {
      0% { r: 6px; opacity: 0.9; }
      100% { r: 18px; opacity: 0; }
    }
    @keyframes streamDash {
      0% { stroke-dashoffset: 200; }
      100% { stroke-dashoffset: 0; }
    }

    .ambient-orb-1 {
      animation: pulseOrb 7s ease-in-out infinite;
      transform-origin: 200px 100px;
    }
    .ambient-orb-2 {
      animation: pulseOrb 9s ease-in-out infinite reverse;
      transform-origin: 1000px 260px;
    }
    .floating-pill-1 {
      animation: floatPillLeft 5s ease-in-out infinite;
    }
    .floating-pill-2 {
      animation: floatPillRight 6s ease-in-out infinite;
    }
    .flow-stream {
      stroke-dasharray: 8, 8;
      animation: streamDash 10s linear infinite;
    }
    .beacon-ring {
      animation: pulseRing 2s cubic-bezier(0, 0.2, 0.8, 1) infinite;
    }
  </style>

  <!-- Background Base -->
  <rect width="1200" height="360" rx="16" class="bg" />
  <rect width="1198" height="358" x="1" y="1" rx="15" fill="none" stroke="#334155" stroke-width="1.5" stroke-opacity="0.6" />

  <!-- Animated Background Elements (Deep layer) -->
  <g opacity="0.7">
    <circle cx="200" cy="100" r="140" fill="#3b82f6" filter="url(#blur-filter)" class="ambient-orb-1" />
    <circle cx="1020" cy="240" r="160" fill="#8b5cf6" filter="url(#blur-filter)" class="ambient-orb-2" />
    <circle cx="600" cy="300" r="110" fill="#ec4899" filter="url(#blur-filter)" opacity="0.25" />
  </g>

  <!-- Flow lines in subtle background -->
  <path d="M 50 280 C 300 240, 450 320, 750 270 C 950 230, 1050 310, 1150 260" fill="none" stroke="#38bdf8" stroke-width="2" stroke-opacity="0.35" class="flow-stream" />
  <path d="M 80 80 C 320 120, 500 40, 800 100 C 1000 140, 1100 60, 1160 90" fill="none" stroke="#a855f7" stroke-width="2" stroke-opacity="0.3" class="flow-stream" />

  <!-- Subtle Dynamic UI Cards in Outer Corners (strictly non-overlapping with center title/subtitles) -->
  <!-- Top Right Card: In-App Tour step -->
  <g transform="translate(940, 40)" class="floating-pill-1">
    <rect width="210" height="64" rx="10" fill="#1e293b" fill-opacity="0.75" stroke="#475569" stroke-width="1" />
    <circle cx="24" cy="32" r="8" fill="#10b981" />
    <circle cx="24" cy="32" r="8" fill="none" stroke="#10b981" stroke-width="2" class="beacon-ring" />
    <text x="44" y="28" font-family="sans-serif" font-size="11" font-weight="700" fill="#38bdf8">IN-APP GUIDANCE</text>
    <text x="44" y="47" font-family="sans-serif" font-size="12" font-weight="500" fill="#e2e8f0">Step 3 of 4: Feature Tour</text>
  </g>

  <!-- Bottom Left Card: Product Analytics -->
  <g transform="translate(50, 250)" class="floating-pill-2">
    <rect width="220" height="64" rx="10" fill="#1e293b" fill-opacity="0.75" stroke="#475569" stroke-width="1" />
    <path d="M 22 284 L 38 274 L 54 278 L 70 262" fill="none" stroke="#a855f7" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
    <text x="80" y="278" font-family="sans-serif" font-size="11" font-weight="700" fill="#c084fc">USER ADOPTION</text>
    <text x="80" y="297" font-family="sans-serif" font-size="12" font-weight="500" fill="#e2e8f0">+84% Onboarding Rate</text>
  </g>

  <!-- Bottom Right Card: Walkthrough Checklist -->
  <g transform="translate(930, 250)" class="floating-pill-1">
    <rect width="220" height="64" rx="10" fill="#1e293b" fill-opacity="0.75" stroke="#475569" stroke-width="1" />
    <circle cx="28" cy="282" r="10" fill="#3b82f6" />
    <path d="M 24 282 L 27 285 L 32 279" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" />
    <text x="48" y="278" font-family="sans-serif" font-size="11" font-weight="700" fill="#60a5fa">SELF-HOSTED / SAAS</text>
    <text x="48" y="297" font-family="sans-serif" font-size="12" font-weight="500" fill="#e2e8f0">Ready for Production</text>
  </g>

  <!-- Top Left: Category Tag -->
  <g transform="translate(50, 45)" class="floating-pill-2">
    <rect width="180" height="34" rx="17" fill="#1e293b" fill-opacity="0.8" stroke="#3b82f6" stroke-width="1" stroke-opacity="0.5" />
    <text x="24" y="67" font-family="sans-serif" font-size="11" font-weight="600" fill="#93c5fd">✨ AWESOME DAP LIST</text>
  </g>

  <!-- FOREGROUND: Clear, crisp Title & Subtitle centered and unblocked -->
  <g id="foreground-text">
    <!-- Main Header -->
    <text x="600" y="145" text-anchor="middle" class="title">Digital Adoption Platforms (DAP)</text>

    <!-- Subtitle -->
    <text x="600" y="185" text-anchor="middle" class="subtitle">Curated Landscape of In-App Guidance, Onboarding &amp; Product Adoption</text>

    <!-- Tagline & Tech Stack Badges -->
    <text x="600" y="215" text-anchor="middle" class="tagline">Enterprise SaaS Solutions • Open-Source Frameworks • Product Analytics</text>

    <!-- Horizontal decorative pill tags in center -->
    <g transform="translate(340, 235)">
      <!-- Pill 1 -->
      <g transform="translate(0, 0)">
        <rect width="110" height="26" rx="13" fill="#3b82f6" fill-opacity="0.18" stroke="#3b82f6" stroke-width="1" stroke-opacity="0.5" />
        <text x="55" y="17" text-anchor="middle" class="badge-text" fill="#93c5fd">🚀 Onboarding</text>
      </g>
      <!-- Pill 2 -->
      <g transform="translate(122, 0)">
        <rect width="125" height="26" rx="13" fill="#8b5cf6" fill-opacity="0.18" stroke="#8b5cf6" stroke-width="1" stroke-opacity="0.5" />
        <text x="62.5" y="17" text-anchor="middle" class="badge-text" fill="#c4b5fd">💡 In-App Tours</text>
      </g>
      <!-- Pill 3 -->
      <g transform="translate(259, 0)">
        <rect width="125" height="26" rx="13" fill="#ec4899" fill-opacity="0.18" stroke="#ec4899" stroke-width="1" stroke-opacity="0.5" />
        <text x="62.5" y="17" text-anchor="middle" class="badge-text" fill="#f472b6">📊 Adoption ROI</text>
      </g>
      <!-- Pill 4 -->
      <g transform="translate(396, 0)">
        <rect width="125" height="26" rx="13" fill="#10b981" fill-opacity="0.18" stroke="#10b981" stroke-width="1" stroke-opacity="0.5" />
        <text x="62.5" y="17" text-anchor="middle" class="badge-text" fill="#6ee7b7">⚡ Open-Source</text>
      </g>
    </g>
  </g>
</svg>
